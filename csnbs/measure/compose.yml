services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: ${BENCHMARK_DB_PASSWORD:?Set BENCHMARK_DB_PASSWORD for the local database}
    ports:
      - "127.0.0.1:${BENCHMARK_DB_PORT:-5433}:5432"
    volumes:
      - benchmark-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  benchmark-data:
