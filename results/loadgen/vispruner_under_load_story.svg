    <dc:description>NVIDIA A40 | commit ae8eaf733863 (dirty worktree) | workload sha256:3933e73c4e08aa1c…
Exploratory: one run per point; n=5–80 successful requests; 10 warmups excluded per campaign. No confidence intervals.
p99 has fewer than 1,000 successful samples at one or more points; tail estimates are unstable.
Some model/pruning settings exist only in the campaign; raw-run metadata cannot fully verify matching.
Serving (campaign): single Uvicorn worker; synchronous model.generate blocks the event loop and serializes requests.</dc:description>
