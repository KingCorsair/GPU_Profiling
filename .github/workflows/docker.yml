name: Build and push Docker image

# Runs when the Dockerfile or requirements change, or when triggered by hand.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'csnbs/requirements-qwen.txt'
      - '.github/workflows/docker.yml'
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # GitHub runners ship with ~14GB free, which isn't enough for a
      # CUDA image. This reclaims ~20GB by removing preinstalled tooling
      # we don't need (Android SDK, .NET, Haskell, etc).
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            kingcorsair/gpu_profiling_project:latest
            kingcorsair/gpu_profiling_project:${{ github.sha }}
          # Cache layers between runs so rebuilds are fast when only
          # requirements.txt changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Done
        run: |
          echo "Image pushed:"
          echo "  kingcorsair/gpu_profiling_project:latest"
          echo "  kingcorsair/gpu_profiling_project:${{ github.sha }}"
          echo ""
          echo "Deploy on RunPod with the custom image:"
          echo "  kingcorsair/gpu_profiling_project:latest"
