name: Build and push Docker image

# Runs when the Dockerfile or requirements change, or when triggered by hand.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      runtime:
        description: Optional model runtime to build
        type: choice
        options: [llava, gemma]
        default: llava

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # GitHub runners ship with ~14GB free, which isn't enough for a
      # CUDA image. This reclaims ~20GB by removing preinstalled tooling
      # we don't need (Android SDK, .NET, Haskell, etc).
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.runtime == 'gemma' && 'csnbs/Dockerfile.gemma' || 'Dockerfile' }}
          push: true
          tags: |
            kingcorsair/gpu_profiling_project:${{ inputs.runtime == 'gemma' && 'gemma' || 'latest' }}
            kingcorsair/gpu_profiling_project:${{ inputs.runtime == 'gemma' && 'gemma-' || '' }}${{ github.sha }}
          # Cache layers between runs so rebuilds are fast when only
          # requirements.txt changes.
          cache-from: type=gha,scope=${{ inputs.runtime || 'llava' }}
          cache-to: type=gha,mode=max,scope=${{ inputs.runtime || 'llava' }}

      - name: Done
        env:
          IMAGE_TAG: ${{ inputs.runtime == 'gemma' && 'gemma' || 'latest' }}
          COMMIT_TAG: ${{ inputs.runtime == 'gemma' && 'gemma-' || '' }}${{ github.sha }}
        run: |
          echo "Image pushed:"
          echo "  kingcorsair/gpu_profiling_project:$IMAGE_TAG"
          echo "  kingcorsair/gpu_profiling_project:$COMMIT_TAG"
          echo ""
          echo "Deploy on RunPod with the custom image:"
          echo "  kingcorsair/gpu_profiling_project:$COMMIT_TAG"
